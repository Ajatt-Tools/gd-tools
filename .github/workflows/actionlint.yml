name: Lint GitHub Actions workflows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub-hosted Ubuntu runners include Go. Pin actionlint for deterministic checks.
      - name: Lint workflows
        shell: bash
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
