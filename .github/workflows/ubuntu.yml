name: Ubuntu 24.04

on:
  pull_request:
  push:
    branches:
      - "**"

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Track new Xmake releases here; release packaging enforces its minimum version separately.
      - name: Install supported Xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: latest

      - name: Install build dependencies
        shell: bash
        run: ./scripts/install_ubuntu_dependencies.sh

      - name: Run tests from source archive
        shell: bash
        run: |
          archive_dir="$(mktemp --directory)"
          git archive --format=tar HEAD | tar --extract --file=- --directory="$archive_dir"
          "$archive_dir/scripts/quicktest.sh"

      - name: Test local installation and removal
        shell: bash
        run: |
          # install-uninstall round trip and check
          ./scripts/quickinstall.sh --local --mandarin
          "$HOME/.local/bin/gd-tools" --help
          test -L "$HOME/.local/bin/gd-translate"
          output="$("$HOME/.local/bin/gd-mecab" --sentence お前はもう死んでいる --word お前)"
          grep -qF '<b>お前</b>' <<< "$output"
          test -f "$HOME/.local/gd-mandarin/sys.dic"
          ./scripts/quickuninstall.sh --local
          test ! -e "$HOME/.local/bin/gd-tools"
          test ! -e "$HOME/.local/bin/gd-mecab"
          test ! -e "$HOME/.local/share/gd-tools"
          test ! -e "$HOME/.local/share/fonts/gd-tools"
          test ! -e "$HOME/.local/gd-mandarin"

          # same but with user-added files
          mkdir -p "$HOME/.local/share/gd-tools" "$HOME/.local/share/fonts/gd-tools" "$HOME/.local/gd-mandarin"
          # create fake files
          touch "$HOME/.local/share/gd-tools/custom.dic"
          touch "$HOME/.local/share/fonts/gd-tools/custom.ttf"
          touch "$HOME/.local/gd-mandarin/custom.dic"
          # install-uninstall
          ./scripts/quickinstall.sh --local --mandarin
          ./scripts/quickuninstall.sh --local
          # fake files should survive
          test -f "$HOME/.local/share/gd-tools/custom.dic"
          test -f "$HOME/.local/share/fonts/gd-tools/custom.ttf"
          test -f "$HOME/.local/gd-mandarin/custom.dic"
          test ! -e "$HOME/.local/gd-mandarin/sys.dic"
