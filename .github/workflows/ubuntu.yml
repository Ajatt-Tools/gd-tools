name: Ubuntu 24.04

on:
  pull_request:
  push:
    branches:
      - "**"

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Match DEB builds, which link Ubuntu's maintained shared libcurl.
      GD_TOOLS_USE_SYSTEM_CURL: y
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Track new Xmake releases here; release packaging enforces its minimum version separately.
      - name: Install supported Xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: latest

      - name: Install build dependencies
        shell: bash
        run: ./scripts/install_ubuntu_dependencies.sh

      - name: Install gd-tools locally
        run: ./scripts/quickinstall.sh --local

      - name: Build tests
        run: xmake config -y -m release --tests=y && xmake build -y -vw tests

      - name: Run tests
        run: xmake run --workdir="$(pwd)" tests
