name: Release Debian Package

on:
  push:
    tags:
      - 'v*'

# Creating a GitHub Release is the only operation that needs write access.
permissions: read-all

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: latest

      - name: Install test dependencies
        shell: bash
        run: ./scripts/install_ubuntu_dependencies.sh

      - name: Run tests
        shell: bash
        run: ./scripts/quicktest.sh

  build-package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Xmake 3.1.0 includes fixes required by the DEB generator and install-file expansion.
      # https://github.com/xmake-io/github-action-setup-xmake
      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: '>=3.1.0'

      - name: Install build and packaging dependencies
        shell: bash
        run: ./scripts/install_ubuntu_dependencies.sh --packaging

      - name: Set package version
        shell: bash
        # GITHUB_REF_NAME is the short tag (v1.8). GITHUB_REF includes refs/tags/ (e.g. refs/tags/v1.8).
        run: echo "GD_TOOLS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Debian package
        shell: bash
        run: ./scripts/build_deb.sh

      - name: Verify shared curl linkage
        shell: bash
        run: ldd build/linux/x86_64/release/gd-tools | grep -qF 'libcurl.so.4'

      # Test the artifact before publishing so a tag cannot release an incomplete install tree.
      - name: Validate Debian package
        shell: bash
        run: |
          test "$(dpkg-deb --field dist/gd-tools.deb Package)" = "gd-tools"
          test "$(dpkg-deb --field dist/gd-tools.deb Version)" = "${GD_TOOLS_VERSION}-1"
          dpkg-deb --contents dist/gd-tools.deb > package-contents.txt
          grep -qF './usr/bin/gd-tools' package-contents.txt
          grep -qF './usr/bin/gd-mecab' package-contents.txt
          grep -qF './usr/bin/gd-translate' package-contents.txt
          grep -qF './usr/bin/gd-strokeorder' package-contents.txt
          if grep -qF './usr/bin/gd-mandarin' package-contents.txt; then exit 1; fi
          grep -qF './usr/share/gd-tools/marisa_words.dic' package-contents.txt
          grep -qF './usr/share/fonts/gd-tools/KanjiStrokeOrders_v4.004.ttf' package-contents.txt
          grep -qF './usr/share/doc/gd-tools/ArmedLemon-LICENSE.txt' package-contents.txt
          dpkg-deb --field dist/gd-tools.deb Depends | grep -qF 'libcurl4t64'

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gd-tools-deb
          path: dist/gd-tools.deb
          if-no-files-found: error

  install-test:
    needs: build-package
    runs-on: ubuntu-24.04
    steps:
      - name: Download Debian package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gd-tools-deb
          path: dist

      - name: Install Debian package and dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ./dist/gd-tools.deb
          test -x /usr/bin/gd-tools
          test -L /usr/bin/gd-mecab
          test -L /usr/bin/gd-translate
          test -x /usr/bin/gd-strokeorder
          test ! -e /usr/bin/gd-mandarin
          test -f /usr/share/gd-tools/marisa_words.dic
          gd-tools --help
          ldd /usr/bin/gd-tools | grep -qF 'libcurl.so.4'

      - name: Test MeCab integration
        shell: bash
        run: |
          output="$(gd-mecab --sentence お前はもう死んでいる --word お前)"
          grep -qF '<b>お前</b>' <<< "$output"
          grep -qF 'href="bword:死ぬ"' <<< "$output"
          grep -qF 'dicdir: /var/lib/mecab/dic/debian' <<< "$output"
          ! grep -qF "Couldn't find dictionary directory" <<< "$output"

  release:
    needs: install-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Debian package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gd-tools-deb
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: "gd-tools ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/gd-tools.deb
